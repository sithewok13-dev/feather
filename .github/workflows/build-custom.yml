name: Build custom IPA

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Resolve Swift packages
        run: |
          # Xcode sometimes crashes during package resolution; retry a few times.
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project Feather.xcodeproj -scheme Feather \
              -derivedDataPath "$TMPDIR/Feather/iphoneos" -skipPackagePluginValidation && exit 0
            echo "Package resolution failed (attempt $i), retrying..."
            sleep 10
          done
          exit 1

      - name: Build unsigned IPA
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make iphoneos || make iphoneos

      - name: Make Feather Updater variant (separate app ID so it can install Feather)
        run: |
          rm -rf updater && mkdir updater && cd updater
          unzip -q ../packages/Feather.ipa
          P=Payload/Feather.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier thewonderofyou.Feather.updater" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Feather Updater" "$P" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Feather Updater" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 featherupdater" "$P" || true
          codesign --force --sign - --timestamp=none Payload/Feather.app
          ditto -c -k --sequesterRsrc --keepParent Payload ../packages/FeatherUpdater.ipa
          cd .. && ls -la packages

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-select-all
          path: packages/Feather.ipa
          if-no-files-found: error

      - name: Publish to ios-latest release (feeds Sithewok's Builds source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build ${{ github.run_number }} · $(date -u +%Y-%m-%d)"
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest packages/Feather.ipa packages/FeatherUpdater.ipa --clobber
            gh release edit ios-latest --notes "$NOTES" --title "Feather (custom) – latest"
          else
            gh release create ios-latest packages/Feather.ipa packages/FeatherUpdater.ipa \
              --target "${{ github.sha }}" --title "Feather (custom) – latest" --notes "$NOTES" --prerelease
          fi
